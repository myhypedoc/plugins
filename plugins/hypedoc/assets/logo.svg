<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-f2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5a9e62"/>
      <stop offset="100%" stop-color="#7fb685"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg-f2)"/>

  <!-- Double chevron with trophy at peak — polished -->
  <g transform="translate(256, 252)">
    <!-- Main upward chevron — thick, bold, confident -->
    <path d="M-114,54 L0,-56 L114,54" fill="none" stroke="white" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Second chevron — lighter, provides depth -->
    <path d="M-78,124 L0,38 L78,124" fill="none" stroke="white" stroke-opacity="0.38" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Trophy at the peak — sitting right on top of the chevron -->
    <g transform="translate(0, -96)">
      <!-- Cup body -->
      <path d="M-30,4 L-26,-36 C-24,-50 -14,-60 0,-60 C14,-60 24,-50 26,-36 L30,4 Z" fill="#FFD460"/>
      <!-- Left handle -->
      <path d="M-30,-30 C-48,-30 -50,-6 -34,0" fill="none" stroke="#FFD460" stroke-width="10" stroke-linecap="round"/>
      <!-- Right handle -->
      <path d="M30,-30 C48,-30 50,-6 34,0" fill="none" stroke="#FFD460" stroke-width="10" stroke-linecap="round"/>
      <!-- Stem -->
      <rect x="-6" y="4" width="12" height="14" rx="3" fill="#FFD460"/>
      <!-- Base -->
      <rect x="-18" y="18" width="36" height="8" rx="4" fill="#FFD460"/>
      <!-- Star on cup -->
      <polygon points="0,-42 5,-30 16,-28 8,-20 10,-8 0,-16 -10,-8 -8,-20 -16,-28 -5,-30" fill="white" opacity="0.95"/>
    </g>

    <!-- Small celebration sparkles around trophy -->
    <circle cx="-48" cy="-120" r="5" fill="#FFD460" opacity="0.8"/>
    <circle cx="52" cy="-126" r="4" fill="#FFD460" opacity="0.7"/>
    <circle cx="0" cy="-166" r="4" fill="white" opacity="0.6"/>
    <circle cx="-64" cy="-140" r="3" fill="white" opacity="0.5"/>
    <circle cx="66" cy="-144" r="3" fill="white" opacity="0.5"/>
  </g>
</svg>
